<script>
"use strict";
/* =====================================================================
   🏙️ NORDICBOOST BYEN — isometrisk 2D-byggespil
   =====================================================================
   - Mønter mintes fra XP: 1 mønt pr. 2 XP (getUnspentCoins nede i core-filen).
   - Byen gemmes i localStorage under "nordicboost_city".
   - Klik på en tom grund → byg. Klik på bygning → opgrader/ Riv ned.
   ===================================================================== */

const GRID = 6;                 // 6x6 grunde
const TILE_W = 108, TILE_H = 54; // isometrisk felt-størrelse
const canvas = document.getElementById("cityCanvas");
const ctx = canvas.getContext("2d");
const t = key => I18N[getLang()][key];

/* ---------- Data: bygninger (katalog) ----------
   type: id, kat: home/biz/pub/deco, navn (uk/da), pris, pop, jobs, happy,
   maxLevel, unlockLevel (sprogniveau fra XP). */
const BUILDINGS = [
  // --- Boliger ---
  { id:"cabin",   kat:"home", uk:"Træhytte",       da:"Træhytte",   cost:60,  pop:6,  jobs:0, happy:2, max:3, unlock:1 },
  { id:"house",   kat:"home", uk:"Hus",            da:"Hus",        cost:140, pop:12, jobs:0, happy:3, max:3, unlock:2 },
  { id:"villa",   kat:"home", uk:"Villa",          da:"Villa",      cost:420, pop:24, jobs:2, happy:6, max:3, unlock:4 },
  { id:"apart",   kat:"home", uk:"Lejlighedskarré",da:"Boligblok",  cost:900, pop:60, jobs:4, happy:5, max:4, unlock:6 },
  // --- Virksomheder ---
  { id:"kiosk",   kat:"biz",  uk:"Kiosk",          da:"Kiosk",      cost:80,  pop:0, jobs:4, happy:1, max:3, unlock:1 },
  { id:"cafe",    kat:"biz",  uk:"Café",           da:"Café",       cost:240, pop:0, jobs:8, happy:4, max:3, unlock:3 },
  { id:"office",  kat:"biz",  uk:"Kontor",         da:"Kontor",     cost:600, pop:0, jobs:20,happy:2, max:3, unlock:5 },
  { id:"factory", kat:"biz",  uk:"Fabrik",         da:"Fabrik",     cost:1200,pop:0, jobs:45,happy:-2,max:3, unlock:7 },
  // --- Offentlige ---
  { id:"school",  kat:"pub",  uk:"Skole",          da:"Skole",      cost:300, pop:0, jobs:10, happy:6, max:3, unlock:3 },
  { id:"park",    kat:"pub",  uk:"Park",           da:"Park",       cost:150, pop:0, jobs:0,  happy:10,max:3, unlock:2 },
  { id:"hospital",kat:"pub",  uk:"Hospital",       da:"Hospital",   cost:800, pop:0, jobs:25, happy:8, max:3, unlock:6 },
  { id:"stadium", kat:"pub",  uk:"Stadion",        da:"Stadion",    cost:2000,pop:0, jobs:30, happy:16,max:2, unlock:9 },
  // --- Dekoration ---
  { id:"tree",    kat:"deco", uk:"Træ",            da:"Træ",        cost:20,  pop:0, jobs:0, happy:2, max:1, unlock:1 },
  { id:"fountain",kat:"deco", uk:"Fontæne",        da:"Fontæne",    cost:120, pop:0, jobs:0, happy:5, max:2, unlock:3 },
  { id:"statue",  kat:"deco", uk:"Statue",         da:"Statue",     cost:350, pop:0, jobs:0, happy:6, max:2, unlock:5 },
  { id:"tower",   kat:"deco", uk:"Udsigtstårn",    da:"Udsigtstårn",cost:1500,pop:0, jobs:4, happy:12,max:2, unlock:8 },
];
const BUILD_BY_ID = Object.fromEntries(BUILDINGS.map(b => [b.id, b]));

/* ---------- Save/load ---------- */
const CITY_KEY = "nordicboost_city";
const TEST_KEY = "nordicboost_city_testbonus";   // midlertidige test-mønter
function loadCity() {
  try {
    const c = JSON.parse(localStorage.getItem(CITY_KEY) || "{}");
    if (c && typeof c === "object" && Array.isArray(c.plots)) {
      c.taxRate  = Number(c.taxRate) || 10;
      c.unhappiness = Number(c.unhappiness) || 0;      // vokser ved hver opkrævning
      c.milestones = Array.isArray(c.milestones) ? c.milestones : [];
      return c;
    }
  } catch (e) {}
  return { plots: new Array(GRID * GRID).fill(null), spent: 0, seenLevel: getLevel(),
           taxRate: 10, unhappiness: 0, milestones: [] };
}
function saveCity(c) { localStorage.setItem(CITY_KEY, JSON.stringify(c)); }
function getTestBonus() { return Number(localStorage.getItem(TEST_KEY)) || 0; }
function addTestCoins(n) { localStorage.setItem(TEST_KEY, String(getTestBonus() + n)); }

/* Mønter = (totalXP / 2) - allerede brugte mønter. XP vokser via læring. */
function getUnspentCoins() {
  const city = loadCity();
  // 1 mønt pr. 2 XP (XP_PER_CORRECT = 10 → 5 mønter pr. rigtigt svar):
  const coins = Math.floor(loadProgress().totalXP / 2) - city.spent + getTestBonus();
  return Math.max(0, coins);
}
function spendCoins(n) {
  const city = loadCity();
  city.spent += n;
  saveCity(city);
}

/* ---------- Kamera: pan + zoom (træk for at flytte, scroll/pinch for zoom) ---------- */
const cam = { x: 0, y: 0, zoom: 1 };
/* render() sætter ÉN canvas-transform (translate/scale) — det er kameraet.
   tileToScreen leverer derfor RENE VERDENS-koordinater (uden cam/zoom),
   ellers bliver kameraet anvendt dobbelt og felterne glider fra hinanden. */
function applyCam(mx, my) {         // skærm → verden (inverse af render-transformen)
  return { x: (mx - canvas.width/2) / cam.zoom - cam.x + canvas.width/2,
           y: (my - 60) / cam.zoom - cam.y + 60 };
}
function tileToScreen(gx, gy) {
  return {
    x: canvas.width  / 2 + (gx - gy) * (TILE_W / 2),
    y: 60            + (gx + gy) * (TILE_H / 2),
  };
}
function screenToTile(mx, my) {
  const w = applyCam(mx, my);          // verden (origo stadig i w/2,60)
  const ox = w.x - canvas.width/2;     // relativt til iso-origo
  const oy = w.y - 60;
  const gx = (ox / (TILE_W/2) + oy / (TILE_H/2)) / 2;
  const gy = (oy / (TILE_H/2) - ox / (TILE_W/2)) / 2;
  return { x: Math.floor(gx), y: Math.floor(gy) };
}
function plotVertices(gx, gy) {
  const p = tileToScreen(gx, gy);
  return [
    [p.x, p.y],
    [p.x + TILE_W/2, p.y + TILE_H/2],
    [p.x, p.y + TILE_H],
    [p.x - TILE_W/2, p.y + TILE_H/2],
  ];
}

/* =====================================================================
   🎨 MODELLER v2 — bygget som rigtige iso-bokse med lys/skygge, tag-
   flader, vinduesrammer, skorstene, detaljer og jord-skygger.
   Alle modeller tegnes i VERDENS-koordinater (kameraet klarer resten).
   ===================================================================== */

/* Farvehjælpere */
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255-r)*f; g += (255-g)*f; b += (255-b)*f; }
  else { r *= (1+f); g *= (1+f); b *= (1+f); }
  return `rgb(${r|0},${g|0},${b|0})`;
}
/* Lys retning: venstre facade = mørk (modlys), højre = mellem, top = lys */
const L = { dark: -0.32, mid: -0.14, light: 0.10 };

/* --- Grundlæggende iso-boks med blød jord-skygge ---
   cx,cy: bundens centrum i verden; w,d: fodaftryk; h: højde */
function isoBox(cx, cy, w, d, h, color, opts = {}) {
  const hw = w/2, hd = d/2;
  // blød skygge på jorden
  if (!opts.noShadow) {
    ctx.fillStyle = "rgba(0,0,0,.25)";
    ctx.beginPath();
    ctx.ellipse(cx + h*0.18, cy + hd*0.4, hw*1.25, hd*0.9, 0, 0, 7);
    ctx.fill();
  }
  const bN = [cx, cy-hd], bE = [cx+hw, cy], bS = [cx, cy+hd], bW = [cx-hw, cy];
  const up = p => [p[0], p[1]-h];
  const tN=up(bN), tE=up(bE), tS=up(bS), tW=up(bW);
  // venstre facade
  ctx.fillStyle = shade(color, L.dark);
  ctx.beginPath(); ctx.moveTo(...bW); ctx.lineTo(...bN); ctx.lineTo(...tN); ctx.lineTo(...tW); ctx.closePath(); ctx.fill();
  // højre facade
  ctx.fillStyle = shade(color, L.mid);
  ctx.beginPath(); ctx.moveTo(...bN); ctx.lineTo(...bE); ctx.lineTo(...tE); ctx.lineTo(...tN); ctx.closePath(); ctx.fill();
  // top
  ctx.fillStyle = shade(color, L.light);
  ctx.beginPath(); ctx.moveTo(...tW); ctx.lineTo(...tN); ctx.lineTo(...tE); ctx.lineTo(...tS); ctx.closePath(); ctx.fill();
  return { bN, bE, bS, bW, tN, tE, tS, tW, hw, hd };
}

/* vindues-ruder MED rammer på en facade (x,y = øverste venstre hjørne) */
function winGrid(x, y, rows, cols, wS, hS, gapX, gapY, litRatio = 0.4) {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const wx = x + c*(wS+gapX), wy = y + r*(hS+gapY);
    const lit = ((r*7 + c*13) % 10) < litRatio*10;
    ctx.fillStyle = "#1b2b45";                      // ramme
    ctx.fillRect(wx-1.5, wy-1.5, wS+3, hS+3);
    const g = ctx.createLinearGradient(wx, wy, wx, wy+hS);
    if (lit) { g.addColorStop(0, "#ffe9a8"); g.addColorStop(1, "#f5b74e"); }
    else { g.addColorStop(0, "#3a5f8a"); g.addColorStop(1, "#22344f"); }
    ctx.fillStyle = g;
    ctx.fillRect(wx, wy, wS, hS);
    ctx.fillStyle = "rgba(255,255,255,.25)";        // refleksion
    ctx.fillRect(wx, wy, wS, 1.5);
  }
}

/* Sadeltag (gable) med tagpap/mønster + rygning */
function gableRoof(cx, cy, w, d, wallH, roofH, wallColor, roofColor) {
  const hw = w/2, hd = d/2;
  // vægge først (to synlige flader, husket fra isoBox-stil)
  ctx.fillStyle = shade(wallColor, L.dark);
  ctx.beginPath(); ctx.moveTo(cx-hw, cy); ctx.lineTo(cx, cy-hd); ctx.lineTo(cx, cy-hd-wallH); ctx.lineTo(cx-hw, cy-wallH); ctx.closePath(); ctx.fill();
  ctx.fillStyle = shade(wallColor, L.mid);
  ctx.beginPath(); ctx.moveTo(cx, cy-hd); ctx.lineTo(cx+hw, cy); ctx.lineTo(cx+hw, cy-wallH); ctx.lineTo(cx, cy-hd-wallH); ctx.closePath(); ctx.fill();
  // gavltrekanter
  ctx.fillStyle = shade(wallColor, 0);
  ctx.beginPath(); ctx.moveTo(cx-hw, cy-wallH); ctx.lineTo(cx, cy-hd-wallH); ctx.lineTo(cx, cy-hd-wallH-roofH); ctx.closePath(); ctx.fill();
  // tagflader med skifte-mønster
  const rows = 4;
  for (let i = 0; i < rows; i++) {
    const t0 = i/rows, t1 = (i+1)/rows;
    ctx.fillStyle = shade(roofColor, (i%2 ? 0.06 : -0.06));
    // venstre tagflade (mod sydvest)
    ctx.beginPath();
    ctx.moveTo(cx-hw + (hw)*t0,        cy - wallH - roofH*t0 - hd*t0);
    ctx.lineTo(cx-hw + (hw)*t1,        cy - wallH - roofH*t1 - hd*t1);
    ctx.lineTo(         0 + (hw)*t1,  cy - hd - wallH - roofH*t1);
    ctx.lineTo(         0 + (hw)*t0,  cy - hd - wallH - roofH*t0);
    ctx.closePath(); ctx.fill();
    // højre tagflade (mørkere)
    ctx.fillStyle = shade(roofColor, (i%2 ? -0.10 : -0.20));
    ctx.beginPath();
    ctx.moveTo(cx+hw - (hw)*t0,        cy - wallH - roofH*t0 - hd*t0);
    ctx.lineTo(cx+hw - (hw)*t1,        cy - wallH - roofH*t1 - hd*t1);
    ctx.lineTo(         0 + (hw)*t1,  cy - hd - wallH - roofH*t1);
    ctx.lineTo(         0 + (hw)*t0,  cy - hd - wallH - roofH*t0);
    ctx.closePath(); ctx.fill();
  }
  // rygning
  ctx.strokeStyle = shade(roofColor, 0.35); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy - hd - wallH - roofH); ctx.lineTo(cx, cy - wallH - roofH + hd); ctx.stroke();
}

/* Dør med lille trappetrin */
function door(cx, baseY, wD = 10, hD = 14, color = "#3d2416") {
  ctx.fillStyle = "#9aa3ad";
  ctx.fillRect(cx - wD/2 - 2, baseY + hD - 2, wD + 4, 4);   // trin
  ctx.fillStyle = color;
  ctx.fillRect(cx - wD/2, baseY, wD, hD);
  ctx.fillStyle = "#ffd76e";
  ctx.beginPath(); ctx.arc(cx + wD/2 - 2, baseY + hD/2, 1.3, 0, 7); ctx.fill();   // håndtag
}

/* Skorsten med murstensbånd + evig røg */
function chimney(cx, baseY, h, color = "#8a4a3a") {
  const w = 9;
  ctx.fillStyle = shade(color, L.dark);
  ctx.fillRect(cx - w/2, baseY - h, w, h);
  ctx.fillStyle = shade(color, L.light);
  ctx.fillRect(cx - w/2 - 1, baseY - h - 3, w + 2, 5);       // munding
  const tm = Date.now() / 900;
  for (let i = 0; i < 4; i++) {
    const ph = (tm + i*0.6) % 3;
    ctx.fillStyle = `rgba(215,215,225,${0.30 - ph*0.08})`;
    ctx.beginPath();
    ctx.arc(cx + Math.sin(ph*2 + i)*4 + ph*7, baseY - h - 6 - ph*14, 2.5 + ph*3, 0, 7);
    ctx.fill();
  }
}

/* ============ BOLIGER ============ */
function drawCabin(cx, cy, lvl) {
  const s = 0.9 + lvl*0.1;
  // stammer på facaden
  gableRoof(cx, cy, 56*s, 34*s, 30*s, 15*s, "#8a5a33", "#54382a");
  ctx.strokeStyle = "rgba(60,35,15,.5)"; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {                                // vandrette stamme-linjer
    ctx.beginPath(); ctx.moveTo(cx-28*s, cy - i*7*s); ctx.lineTo(cx, cy-17*s - i*7*s); ctx.stroke();
  }
  door(cx - 8*s, cy - 2*s, 9*s, 12*s);
  winGrid(cx + 6*s, cy - 22*s, 1, 2, 6*s, 7*s, 5*s, 0, 0.7);
  chimney(cx + 14*s, cy - 34*s, 12*s, "#6d4a2f");
}
function drawHouse(cx, cy, lvl) {
  const s = 0.9 + lvl*0.1;
  gableRoof(cx, cy, 62*s, 40*s, 36*s, 17*s, "#e8e2d0", "#b3453a");
  door(cx, cy - 2*s, 10*s, 14*s, "#4a2e1d");
  winGrid(cx - 24*s, cy - 30*s, 1, 2, 7*s, 8*s, 7*s, 0, 0.55);
  winGrid(cx + 8*s, cy - 26*s, 1, 2, 7*s, 8*s, 7*s, 0, 0.55);
  chimney(cx - 16*s, cy - 40*s, 14*s, "#9c5a48");
  // hæk
  ctx.fillStyle = "#2f7d3a";
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(cx - 20*s + i*9*s, cy + 12*s, 5*s, 0, 7); ctx.fill(); }
}
function drawVilla(cx, cy, lvl) {
  const s = 0.9 + lvl*0.12;
  gableRoof(cx, cy, 72*s, 46*s, 44*s, 20*s, "#f2ead6", "#7a4a8f");
  door(cx, cy - 2*s, 11*s, 16*s, "#402a20");
  winGrid(cx - 27*s, cy - 36*s, 2, 2, 8*s, 9*s, 9*s, 8*s, 0.7);
  winGrid(cx + 12*s, cy - 30*s, 1, 3, 8*s, 9*s, 8*s, 0, 0.7);
  chimney(cx + 20*s, cy - 46*s, 14*s, "#6d5a70");
  // pool med glans
  const pg = ctx.createLinearGradient(cx-40*s, cy+8, cx-16*s, cy+18);
  pg.addColorStop(0, "#5fd8ff"); pg.addColorStop(1, "#2ba8e0");
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.ellipse(cx - 28*s, cy + 13*s, 13*s, 6.5*s, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(cx - 30*s, cy + 11*s, 7*s, 2.5*s, 0, 0, 7); ctx.stroke();
}
function drawApart(cx, cy, lvl) {
  const floors = 4 + Math.min(3, lvl-1);
  const h = floors * 16;
  const b = isoBox(cx, cy, 64, 44, h, "#7d8aa5");
  // vinduer på begge facader med etage-markering
  for (const [x0, y0, cols] of [[cx-27, 10, 3],[cx+3, 22, 3]]) {
    for (let f = 0; f < floors - 1; f++) {
      winGrid(x0, cy - h + 12 + f*16, 1, cols, 7, 8, 10, 0, 0.45);
    }
  }
  // tagkant + antenne
  ctx.fillStyle = "#48566d";
  ctx.beginPath(); ctx.moveTo(b.tW[0]+4, b.tW[1]+4); ctx.lineTo(b.tN[0], b.tN[1]+4);
  ctx.lineTo(b.tE[0], b.tE[1]+4); ctx.lineTo(b.tS[0], b.tS[1]+4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#aebbcc"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, b.tN[1]); ctx.lineTo(cx, b.tN[1]-14); ctx.stroke();
  ctx.fillStyle = "#39ff88";
  ctx.beginPath(); ctx.arc(cx, b.tN[1]-16, 2, 0, 7); ctx.fill();
}

/* ============ VIRKSOMHEDER ============ */
function drawKiosk(cx, cy, lvl) {
  const s = 0.9 + lvl*0.1;
  gableRoof(cx, cy, 44*s, 30*s, 24*s, 10*s, "#ffd76e", "#e8833a");
  // skilt med tekst
  ctx.fillStyle = "#ff5747";
  ctx.fillRect(cx - 13*s, cy - 30*s, 26*s, 9*s);
  ctx.fillStyle = "#fff"; ctx.font = `bold ${6*s}px sans-serif`; ctx.textAlign = "center";
  ctx.fillText("KIOSK", cx, cy - 23.5*s);
  door(cx, cy - 1*s, 8*s, 10*s, "#7a4a2f");
  winGrid(cx + 8*s, cy - 18*s, 1, 1, 7*s, 6*s, 0, 0, 0.8);
}
function drawCafe(cx, cy, lvl) {
  const s = 0.9 + lvl*0.1;
  gableRoof(cx, cy, 58*s, 38*s, 30*s, 13*s, "#e8d8c3", "#c46a4a");
  // markise (stripet)
  const aw = 26*s;
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 ? "#e04a5f" : "#f6f2ea";
    ctx.fillRect(cx + 10*s + i*aw/6, cy + 4*s, aw/6 + 1, 10*s);
  }
  winGrid(cx - 22*s, cy - 24*s, 1, 2, 7*s, 8*s, 7*s, 0, 0.8);
  // parasol + bord

function drawTree(cx, cy, s = 1) {

function drawFountainParts(cx, cy, s = 1) {
  // bassin i to niveauer
  ctx.fillStyle = "#a9b2bc";
  ctx.beginPath(); ctx.ellipse(cx, cy, 19*s, 9.5*s, 0, 0, 7); ctx.fill();
  const wg = ctx.createLinearGradient(cx-14*s, cy-3, cx+14*s, cy+3);
  wg.addColorStop(0, "#7fd8ff"); wg.addColorStop(1, "#2ba8e0");
  ctx.fillStyle = wg;
  ctx.beginPath(); ctx.ellipse(cx, cy, 14.5*s, 6.5*s, 0, 0, 7); ctx.fill();
  // søjle + skål
  ctx.fillStyle = "#cfd6de";
  ctx.fillRect(cx-2.2*s, cy - 13*s, 4.4*s, 13*s);
  ctx.fillStyle = "#dde3e9";
  ctx.beginPath(); ctx.ellipse(cx, cy - 13*s, 8*s, 3.5*s, 0, 0, 7); ctx.fill();
  // vand-animation: bue-stråler
  const ph = Date.now() / 420;
  ctx.strokeStyle = "rgba(140,225,255,.85)"; ctx.lineWidth = 1.4;
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + ph * 0.8;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 15*s);
    ctx.quadraticCurveTo(cx + Math.cos(a)*9*s, cy - 20*s - Math.abs(Math.sin(ph*2+i))*4*s,
                         cx + Math.cos(a)*13*s, cy - 13*s + Math.sin(a)*4*s);
    ctx.stroke();
  }
  // dråber
  ctx.fillStyle = "rgba(180,240,255,.9)";
  for (let i = 0; i < 4; i++) {
    const dp = (ph*2 + i*0.7) % 2;
    ctx.beginPath(); ctx.arc(cx + Math.cos(i*1.6+ph)*12*s, cy - 12*s + dp*9*s, 1.4*s, 0, 7); ctx.fill();
  }
}

/* ---------- Rendering af hele byen ---------- */
let hoverPlot = -1;
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const city = loadCity();
  // Verdens-transform: tegn alt i verdenskoordinater; kameraet gør resten
  ctx.save();
  ctx.translate(canvas.width/2, 60);
  ctx.scale(cam.zoom, cam.zoom);
  ctx.translate(cam.x, cam.y);
  ctx.translate(-canvas.width/2, -60);

  // baggrund: let gradient-himmel
  const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
  sky.addColorStop(0, "#0d1424"); sky.addColorStop(1, "#131c30");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

  // stjerner
  ctx.fillStyle = "rgba(255,255,255,.5)";
  for (let i = 0; i < 40; i++) {
    const x = (i*137) % canvas.width, y = (i*89) % 200;
    ctx.fillRect(x, y, 1.5, 1.5);
  }

  const drawOrder = [];
  for (let gy = 0; gy < GRID; gy++) for (let gx = 0; gx < GRID; gx++) {
    drawOrder.push({ gx, gy, i: gy * GRID + gx });
  }
  drawOrder.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));

  for (const o of drawOrder) {
    const plot = city.plots[o.i];
    const p = tileToScreen(o.gx, o.gy);
    const cx = p.x, cy = p.y + TILE_H / 2;
    const isHover = hoverPlot === o.i;

    // mark-grund
    const v = plotVertices(o.gx, o.gy);
    ctx.beginPath();
    ctx.moveTo(v[0][0], v[0][1]); ctx.lineTo(v[1][0], v[1][1]);
    ctx.lineTo(v[2][0], v[2][1]); ctx.lineTo(v[3][0], v[3][1]); ctx.closePath();
    ctx.fillStyle = plot ? "#2e4a33" : (isHover ? "#41694a" : "#35543c");
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.12)";
    ctx.stroke();

    // bygning på grunden
    if (plot) {
      const B = BUILD_BY_ID[plot.type];
      DRAW[plot.type](cx, cy, plot.level);
      // niveau-stjerner over bygningen
      ctx.fillStyle = "#ffd76e"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("★".repeat(plot.level), cx, cy - 90);
    } else if (isHover) {
      ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("+", cx, cy - 10);
    }
  }
  ctx.restore();
  requestAnimationFrame(render);
}

/* ---------- Interaction: pan (træk), zoom (scroll/pinch), klik ---------- */
function evPos(ev) {
  const rect = canvas.getBoundingClientRect();
  const p = ev.touches ? ev.touches[0] : ev;
  return {
    x: (p.clientX - rect.left) * (canvas.width / rect.width),
    y: (p.clientY - rect.top)  * (canvas.height / rect.height),
  };
}
function plotFromPos(mx, my) {
  const { x, y } = screenToTile(mx, my);
  if (x < 0 || y < 0 || x >= GRID || y >= GRID) return -1;
  return y * GRID + x;
}

let dragging = false, dragMoved = 0, lastPos = null;

canvas.addEventListener("mousedown", ev => {
  dragging = true; dragMoved = 0; lastPos = evPos(ev);
});
window.addEventListener("mouseup", ev => {
  if (dragging && dragMoved < 6) {           // det var et klik, ikke et drag
    const p = evPos(ev);
    const i = plotFromPos(p.x, p.y);
    if (i >= 0) openBuildModal(i);
  }
  dragging = false; lastPos = null;
});
canvas.addEventListener("mousemove", ev => {
  const p = evPos(ev);
  if (dragging && lastPos) {
    const dx = p.x - lastPos.x, dy = p.y - lastPos.y;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    cam.x += dx / cam.zoom; cam.y += dy / cam.zoom;
    lastPos = p;
  } else {
    hoverPlot = plotFromPos(p.x, p.y);
  }
});
canvas.addEventListener("mouseleave", () => { hoverPlot = -1; });

// Zoom med hjul (skærm-/trackpad-brugere)
canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  const before = applyCam(evPos(ev).x, evPos(ev).y);
  cam.zoom = Math.min(2.2, Math.max(0.5, cam.zoom * (ev.deltaY < 0 ? 1.12 : 0.89)));
  const after = applyCam(evPos(ev).x, evPos(ev).y);
  cam.x += after.x - before.x;   // zoom mod markøren
  cam.y += after.y - before.y;
}, { passive: false });

// Touch: én finger = pan, to fingre = pinch-zoom
let pinchDist = null;
canvas.addEventListener("touchstart", ev => {
  if (ev.touches.length === 2) {
    pinchDist = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                           ev.touches[0].clientY - ev.touches[1].clientY);
  } else {
    dragging = true; dragMoved = 0; lastPos = evPos(ev);
  }
}, { passive: true });
canvas.addEventListener("touchmove", ev => {
  ev.preventDefault();
  if (ev.touches.length === 2 && pinchDist) {
    const d = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX,
                         ev.touches[0].clientY - ev.touches[1].clientY);
    cam.zoom = Math.min(2.2, Math.max(0.5, cam.zoom * (d / pinchDist)));
    pinchDist = d;
  } else if (dragging && lastPos) {
    const p = evPos(ev);
    dragMoved += 1;
    cam.x += (p.x - lastPos.x) / cam.zoom;
    cam.y += (p.y - lastPos.y) / cam.zoom;
    lastPos = p;
  }
}, { passive: false });
canvas.addEventListener("touchend", ev => {
  if (dragging && dragMoved === 0) {
    const p = evPos(ev.changedTouches[0]);
    const i = plotFromPos(p.x, p.y);
    if (i >= 0) openBuildModal(i);
  }
  dragging = false; pinchDist = null;
});

document.getElementById("btnResetView").addEventListener("click", () => {
  cam.x = 0; cam.y = 0; cam.zoom = 1;
});

/* ---------- HUD ---------- */
function cityStats() {
  const city = loadCity();
  let pop = 0, jobs = 0, happy = 0;
  city.plots.forEach(p => {
    if (!p) return;
    const B = BUILD_BY_ID[p.type];
    const m = 1 + (p.level - 1) * 0.5;   // opgradering giver +50 % pr. niveau
    pop  += Math.round(B.pop  * m);
    jobs += Math.round(B.jobs * m);
    happy += B.happy;
  });
  const taxPenalty = Math.max(0, city.taxRate - 10) * 0.6;  // kun skat OVER 10 % straffer
  const happyPct = Math.max(0, Math.min(100, 50 + happy - taxPenalty - city.unhappiness));
  return { pop, jobs, happy: happyPct };
}
function refreshHUD() {
  const s = cityStats();
  const city = loadCity();
  document.getElementById("hudCoins").textContent = "🪙 " + getUnspentCoins();
  document.getElementById("hudPop").textContent  = "👥 " + s.pop;
  document.getElementById("hudJobs").textContent = "💼 " + s.jobs;
  document.getElementById("hudXP").textContent   = "⚡ " + loadProgress().totalXP;
  const happyEl = document.getElementById("hudHappy");
  happyEl.textContent = (s.happy < 35 ? "😠 " : "😊 ") + s.happy + "%";
  happyEl.style.color = s.happy < 35 ? "#ff9db1" : "";
  // skatte-panel
  document.getElementById("taxSlider").value = city.taxRate;
  document.getElementById("taxLabel").textContent = city.taxRate + "%";
  document.getElementById("taxIncome").textContent = "⚡" + taxIncomeEstimate();
  checkMilestones(s.pop);
}

/* Skatte-mekanik: XP = befolkning × skatteprocent × glædes-faktor.
   Høj skat (>10 %) gør borgerne utilfredse: unhappiness stiger ved hver opkrævning
   og falder langsomt igen over tid (når skatten sænkes). */
function taxIncomeEstimate() {
  const s = cityStats();
  const city = loadCity();
  if (s.pop === 0) return 0;
  const happyFactor = 0.5 + s.happy / 100;         // gladere by = mere grundlag
  return Math.max(1, Math.round(s.pop * (city.taxRate / 100) * 2 * happyFactor));
}
function collectTax() {
  const city = loadCity();
  const gain = taxIncomeEstimate();
  const progress = loadProgress();
  progress.totalXP += gain;
  saveProgress(progress);
  // Utilfredshed: kun skat over 10 % skader; højere skat = hurtigere vrede
  if (city.taxRate > 10) {
    city.unhappiness = Math.min(60, city.unhappiness + (city.taxRate - 10) * 0.5);
  } else {
    // skat ≤ 10 %: borgerne køler lidt ned igen
    city.unhappiness = Math.max(0, city.unhappiness - 1);
  }
  saveCity(city);
  showToast("💰 +" + gain + " XP!");
  const s = cityStats();
  if (s.happy < 35) showToast(t("city.happy_warn"), true);
  refreshHUD();
}

/* Befolknings-milepæle: engangs-møntbonus første gang byen når et mål */
const MILESTONES = [10, 25, 50, 100, 200, 400, 800];
function checkMilestones(pop) {
  const city = loadCity();
  MILESTONES.forEach((goal, idx) => {
    if (pop >= goal && !city.milestones.includes(goal)) {
      city.milestones.push(goal);
      const bonus = goal * 2;                 // 10→20, 25→50, 50→100 ...
      addTestCoins(bonus);                    // bonus mønter (genbruger test-mekanikken)
      saveCity(city);
      showToast("🎉 " + t("city.milestone") + bonus + " 🪙");
    }
  });
}

/* Utilfredshed daler langsomt af sig selv (tilgivelighed over tid) */
setInterval(() => {
  const city = loadCity();
  if (city.unhappiness > 0 && city.taxRate <= 10) {
    city.unhappiness = Math.max(0, city.unhappiness - 0.5);
    saveCity(city);
    refreshHUD();
  }
}, 15000);

/* ---------- Byg-modal ---------- */
let currentPlot = -1;
let currentTab = "home";
const KATS = [["home","city.tab.home"], ["biz","city.tab.biz"], ["pub","city.tab.pub"], ["deco","city.tab.deco"]];

function upgradeCost(B, level) {
  return Math.round(B.cost * 0.6 * level);
}

function openBuildModal(i) {
  const city = loadCity();
  currentPlot = i;
  const plot = city.plots[i];
  const modal = document.getElementById("buildModal");
  modal.classList.add("open");

  const title = document.getElementById("buildModalTitle");
  if (plot) {
    const B = BUILD_BY_ID[plot.type];
    const name = getLang() === "da" ? B.da : B.uk;
    title.textContent = name + " · ★".repeat(plot.level) + " " + t("city.info");
    renderBuildingActions(plot);
  } else {
    title.textContent = t("city.empty");
    currentTab = "home";
    renderTabs();
    renderCatalog();
  }
}
function renderTabs() {
  const el = document.getElementById("cityTabs");
  el.innerHTML = "";
  KATS.forEach(([kat, key]) => {
    const b = document.createElement("button");
    b.className = "btn btn--small " + (kat === currentTab ? "" : "btn--ghost");
    b.textContent = t(key);
    b.onclick = () => { currentTab = kat; renderTabs(); renderCatalog(); };
    el.appendChild(b);
  });
}
function renderCatalog() {
  const el = document.getElementById("cityCatalog");
  el.innerHTML = "";
  const level = getLevel();
  const coins = getUnspentCoins();
  BUILDINGS.filter(b => b.kat === currentTab).forEach(B => {
    const locked = level < B.unlock;
    const afford = coins >= B.cost;
    const name = getLang() === "da" ? B.da : B.uk;
    const div = document.createElement("div");
    div.className = "city-item" + (locked ? " city-item--locked" : "");
    div.innerHTML =
      '<div class="city-item__icon">' + emojiFor(B.id) + '</div>' +
      '<div class="city-item__body">' +
        '<strong>' + name + '</strong>' +
        '<span class="muted">' + "👥" + B.pop + " 💼" + B.jobs + " 😊" + B.happy + '</span>' +
        (locked
          ? '<span class="city-item__price city-item__price--locked">' + t("city.locked") + " " + B.unlock + "</span>"
          : '<span class="city-item__price' + (afford ? "" : " city-item__price--poor") + '">🪙 ' + B.cost + "</span>") +
      '</div>';
    if (!locked) div.onclick = () => tryBuild(B.id);
    el.appendChild(div);
  });
}
function emojiFor(id) {
  return { cabin:"🛖", house:"🏠", villa:"🏡", apart:"🏢", kiosk:"🏪", cafe:"☕",
           office:"🏢", factory:"🏭", school:"🏫", park:"🌳", hospital:"🏥",
           stadium:"🏟️", tree:"🌲", fountain:"⛲", statue:"🗿", tower:"🗼" }[id] || "🏠";
}
function tryBuild(typeId) {
  const B = BUILD_BY_ID[typeId];
  const city = loadCity();
  if (getUnspentCoins() < B.cost) { showToast(t("city.cant_afford"), true); return; }
  spendCoins(B.cost);
  city.plots[currentPlot] = { type: typeId, level: 1 };
  saveCity(city);
  const name = getLang() === "da" ? B.da : B.uk;
  showToast("🎉 " + name + t("city.built"));
  document.getElementById("buildModal").classList.remove("open");
  refreshHUD();
}
function renderBuildingActions(plot) {
  const B = BUILD_BY_ID[plot.type];
  const tabs = document.getElementById("cityTabs");
  const cat = document.getElementById("cityCatalog");
  tabs.innerHTML = "";
  cat.innerHTML = "";

  // Opgrader
  if (plot.level < B.max) {
    const cost = upgradeCost(B, plot.level);
    const afford = getUnspentCoins() >= cost;
    const btn = document.createElement("button");
    btn.className = "btn btn--big" + (afford ? "" : " btn--ghost");
    btn.textContent = "⬆ " + t("city.upgrade") + " (🪙 " + cost + ")";
    btn.onclick = () => {
      if (getUnspentCoins() < cost) { showToast(t("city.cant_afford"), true); return; }
      spendCoins(cost);
      const c = loadCity();
      c.plots[currentPlot].level++;
      saveCity(c);
      showToast("⬆ " + (getLang() === "da" ? B.da : B.uk) + t("city.upgraded") + c.plots[currentPlot].level);
      document.getElementById("buildModal").classList.remove("open");
      refreshHUD();
    };
    cat.appendChild(btn);
  } else {
    const note = document.createElement("p");
    note.className = "center";
    note.textContent = t("city.maxed");
    cat.appendChild(note);
  }

  // Riv ned (50 % refunderet)
  let refund = B.cost / 2;
  for (let l = 1; l < plot.level; l++) refund += upgradeCost(B, l) / 2;
  refund = Math.round(refund);
  const demoBtn = document.createElement("button");
  demoBtn.className = "btn btn--danger mt-2";
  demoBtn.textContent = "💣 " + t("city.demo") + " (🪙 " + refund + ")";
  demoBtn.onclick = () => {
    if (!confirm((getLang() === "da" ? B.da : B.uk) + " " + t("city.demoed") + "🪙 " + refund + "?")) return;
    const c = loadCity();
    c.plots[currentPlot] = null;
    c.spent -= refund;
    saveCity(c);
    document.getElementById("buildModal").classList.remove("open");
    refreshHUD();
  };
  cat.appendChild(demoBtn);
}

document.getElementById("btnCloseBuild").addEventListener("click", () =>
  document.getElementById("buildModal").classList.remove("open"));

/* ---------- Init ---------- */
applyI18n();
refreshHUD();
render();
setInterval(refreshHUD, 2000);   // HUD følger med hvis XP stiger i andet faneblad

document.getElementById("taxSlider").addEventListener("input", ev => {
  const city = loadCity();
  city.taxRate = Number(ev.target.value);
  saveCity(city);
  refreshHUD();
});
document.getElementById("btnCollectTax").addEventListener("click", collectTax);
document.getElementById("btnTestCoins").addEventListener("click", () => {
  addTestCoins(500);
  showToast("🧪 +500 test-mønter!");
  refreshHUD();
});
</script>
