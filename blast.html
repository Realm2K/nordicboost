<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicBoost — Word Blast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <span class="nav__brand">⚡ NORDICBOOST</span>
  <div class="nav__links">
    <a href="index.html">Головна</a>
    <a href="flashcards.html">Картки</a>
    <a href="quiz.html">Квіз</a>
    <a href="blast.html" class="active">Word Blast</a>
  </div>
</nav>

<main class="container">
  <h1 class="page-title">🚀 Word Blast</h1>
  <p class="page-sub">Друкуй український переклад слова, що падає, і натисни <strong>Enter</strong>. Якщо слово впаде внизу — втратиш життя! ❤️❤️❤️</p>

  <!-- HUD: рахунок / XP / життя -->
  <div class="blast-hud">
    <span class="pill">💥 Рахунок: <span id="blastScore">0</span></span>
    <span class="pill" style="color:var(--neon-green)">+<span id="blastXP">0</span> XP</span>
    <span class="pill" id="blastLives">❤️❤️❤️</span>
  </div>

  <div class="blast-wrap">
    <canvas id="blastCanvas"></canvas>
  </div>

  <input id="blastInput" type="text" placeholder="Введи переклад і натисни Enter…" autocomplete="off" autofocus>

  <div class="center mt-2">
    <button class="btn" id="btnStart">▶ Почати гру</button>
    <button class="btn btn--ghost" id="btnRestart" style="display:none">🔄 Грати ще раз</button>
  </div>
</main>

<!-- Екран кінця гри -->
<div class="modal-overlay" id="gameOverModal">
  <div class="modal">
    <h2>💥 Гра закінчена!</h2>
    <p>Рахунок: <strong id="finalScore">0</strong></p>
    <p>Зароблено XP: <strong id="finalXP" style="color:var(--neon-green)">0</strong></p>
    <button class="btn mt-2" onclick="location.reload()">Грати ще раз 🔄</button>
  </div>
</div>

<script src="data.js"></script>
<script src="core.js"></script>
<script>
/* =========================================================
   WORD BLAST — швидка гра з падаючими словами (Canvas)
   =========================================================
   ⚙️ УСІ НАЛАШТУВАННЯ (швидкість, частота, XP, життя) —
   у файлі core.js, об'єкт CONFIG.BLAST. Зміни числа там!
   ========================================================= */

const canvas = document.getElementById("blastCanvas");
const ctx = canvas.getContext("2d");
const input = document.getElementById("blastInput");

let words = [];        // активні падаючі слова
let particles = [];    // ефект вибуху
let running = false;
let score = 0, gameXP = 0, lives = 0;
let fallSpeed = 0, spawnInterval = 0, lastSpawn = 0, lastTime = 0;

/* Підганяємо розмір канваса під ширину екрана (плюс HiDPI) */
function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas);

/* Клас падаючого слова */
class FallingWord {
  constructor(word) {
    this.word = word;                      // об'єкт зі словником
    this.x = 40 + Math.random() * (canvas.clientWidth - 80);
    this.y = -20;
    this.exploding = false;
  }
  update(dt) {
    this.y += fallSpeed * dt;              // dt у секундах
  }
  draw() {
    ctx.font = "700 22px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#35e6ff";
    ctx.shadowColor = "#35e6ff";
    ctx.shadowBlur = 12;
    ctx.fillText(this.word.da, this.x, this.y);
    ctx.shadowBlur = 0;
  }
}

/* Частинки вибуху */
function spawnExplosion(x, y) {
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 180;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 0.6 + Math.random() * 0.4,
      color: ["#39ff88", "#35e6ff", "#ff3ea5", "#ffd93d"][Math.floor(Math.random() * 4)],
    });
  }
}

/* Додає нове падаюче слово */
function spawnWord() {
  const pool = WORDS;
  const w = pool[Math.floor(Math.random() * pool.length)];
  words.push(new FallingWord(w));
}

/* Оновлює HUD (життя/рахунок/XP) */
function updateHUD() {
  document.getElementById("blastScore").textContent = score;
  document.getElementById("blastXP").textContent = gameXP;
  document.getElementById("blastLives").textContent = "❤️".repeat(Math.max(0, lives));
}

/* Основний цикл гри */
function loop(timestamp) {
  if (!running) return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // обмежуємо dt
  lastTime = timestamp;

  // Поява нових слів
  if (timestamp - lastSpawn > spawnInterval) {
    spawnWord();
    lastSpawn = timestamp;
  }

  ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

  // Оновлюємо і малюємо слова
  for (let i = words.length - 1; i >= 0; i--) {
    const fw = words[i];
    fw.update(dt);
    fw.draw();

    // Слово досягло низу → мінус життя
    if (fw.y > canvas.clientHeight - 10) {
      words.splice(i, 1);
      lives--;
      updateHUD();
      if (lives <= 0) endGame();
    }
  }

  // Частинки вибуху
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 200 * dt; // «гравітація» частинок
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}

/* Перевірка введеного тексту (Enter) */
input.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !running) return;
  const typed = input.value.trim().toLowerCase();

  // Порівнюємо з кожним активним словом (перше збігання)
  for (let i = 0; i < words.length; i++) {
    const fw = words[i];
    const ukNorm = fw.word.uk.toLowerCase();
    // Допускаємо коротші альтернативи через «/» у перекладі (напр. «гол / ворота»)
    const accepted = ukNorm.split("/").map(s => s.trim());
    if (accepted.includes(typed)) {
      // 🎯 Правильно!
      words.splice(i, 1);
      spawnExplosion(fw.x, fw.y);
      score++;
      gameXP += CONFIG.XP_PER_CORRECT;
      recordCorrectAnswer(fw.word.id);          // ← mastery++ у localStorage

      // Прогресія складності (усі числа — в core.js, CONFIG.BLAST)
      fallSpeed = Math.min(CONFIG.BLAST.FALL_SPEED_MAX, fallSpeed * CONFIG.BLAST.FALL_SPEED_RAMP);
      spawnInterval = Math.max(CONFIG.BLAST.SPAWN_INTERVAL_MIN, spawnInterval * CONFIG.BLAST.SPAWN_RAMP);

      updateHUD();
      input.value = "";
      input.placeholder = "💪 Влучно! Наступне слово…";
      setTimeout(() => input.placeholder = "Введи переклад і натисни Enter…", 700);
      return;
    }
  }

  // Невірно — просто очищаємо поле
  input.value = "";
  input.placeholder = "❌ Мимо! Спробуй ще…";
  setTimeout(() => input.placeholder = "Введи переклад і натисни Enter…", 700);
});

/* Початок гри */
function startGame() {
  words = []; particles = [];
  score = 0; gameXP = 0;
  lives = CONFIG.BLAST.START_LIVES;
  fallSpeed = CONFIG.BLAST.FALL_SPEED_START;
  spawnInterval = CONFIG.BLAST.SPAWN_INTERVAL_START;
  lastSpawn = 0; lastTime = performance.now();
  running = true;
  updateHUD();
  document.getElementById("btnStart").style.display = "none";
  requestAnimationFrame(loop);
}

/* Кінець гри */
function endGame() {
  running = false;
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalXP").textContent = gameXP;
  document.getElementById("gameOverModal").classList.add("open");
  // XP уже збережено через recordCorrectAnswer() під час гри
}

document.getElementById("btnStart").addEventListener("click", () => {
  resizeCanvas();
  startGame();
  input.focus();
});

resizeCanvas();
</script>
</body>
</html>
