<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicBoost — Word Blast</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<nav class="nav">
  <span class="nav__brand">⚡ NORDICBOOST</span>
  <div class="nav__links">
    <a href="index.html" data-i18n="nav.home">Головна</a>
    <a href="flashcards.html" data-i18n="nav.cards">Картки</a>
    <a href="quiz.html" data-i18n="nav.quiz">Квіз</a>
    <a href="blast.html" class="active" data-i18n="nav.blast">Word Blast</a>
    <a href="match.html" data-i18n="nav.match">Match</a>
    <a href="grammar.html" data-i18n="nav.grammar">Граматика</a>
    <button class="btn btn--ghost btn--small" data-lang-toggle onclick="toggleLang()">🇩🇰 DA</button>
  </div>
</nav>

<main class="container">
  <h1 class="page-title">🚀 Word Blast</h1>
  <p class="page-sub"><span data-i18n="blast.sub1">Друкуй український переклад слова, що падає, і натисни</span> <strong>Enter</strong><span data-i18n="blast.sub2">. Якщо слово впаде внизу — втратиш життя!</span> ❤️❤️❤️</p>

  <!-- HUD -->
  <div class="blast-hud">
    <span class="pill">💥 <span data-i18n="blast.score">Рахунок</span>: <span id="blastScore">0</span></span>
    <span class="pill" style="color:var(--neon-green)">+<span id="blastXP">0</span> XP</span>
    <span class="pill" id="blastLives">❤️❤️❤️</span>
  </div>

  <div class="blast-wrap">
    <canvas id="blastCanvas"></canvas>
  </div>

  <input id="blastInput" type="text" data-i18n-ph="blast.input_ph" placeholder="Введи переклад і натисни Enter…" autocomplete="off" autofocus>

  <!-- Вибір пака -->
  <div class="flash-controls" style="justify-content:flex-start">
    <label class="muted" data-i18n="pack.choose">Ord Pakke:</label>
    <select id="packSelect" class="btn btn--ghost btn--small" style="color:var(--text)"></select>
  </div>

  <div class="center mt-2">
    <button class="btn" id="btnStart" data-i18n="blast.start">▶ Почати гру</button>
  </div>
</main>

<!-- Кінець гри -->
<div class="modal-overlay" id="gameOverModal">
  <div class="modal">
    <h2 data-i18n="blast.over">💥 Гра закінчена!</h2>
    <p><span data-i18n="blast.score_label">Рахунок: </span><strong id="finalScore">0</strong></p>
    <p><span data-i18n="blast.xp_label">Зароблено XP: </span><strong id="finalXP" style="color:var(--neon-green)">0</strong></p>
    <button class="btn mt-2" onclick="location.reload()" data-i18n="blast.again">Грати ще раз 🔄</button>
  </div>
</div>

<script src="data.js?v=7"></script>
<script src="core.js?v=7"></script>
<script>
const canvas = document.getElementById("blastCanvas");
const ctx = canvas.getContext("2d");
const input = document.getElementById("blastInput");

let words = [];
let particles = [];
let running = false;
let score = 0, gameXP = 0, lives = 0;
let fallSpeed = 0, spawnInterval = 0, lastSpawn = 0, lastTime = 0;
let starfield = [];          // фонові «зорі» — легкий паралакс

const t = key => I18N[getLang()][key];

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas);

/* Зорі для фону (глибокий космос 🌌) */
function initStars() {
  starfield = [];
  for (let i = 0; i < 60; i++) {
    starfield.push({
      x: Math.random() * canvas.clientWidth,
      y: Math.random() * canvas.clientHeight,
      r: Math.random() * 1.5 + 0.4,
      speed: 10 + Math.random() * 25,
    });
  }
}

class FallingWord {
  constructor(word) {
    this.word = word;
    this.x = 40 + Math.random() * (canvas.clientWidth - 80);
    this.y = -20;
  }
  update(dt) { this.y += fallSpeed * dt; }
  draw() {
    ctx.font = "700 22px 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#35e6ff";
    ctx.shadowColor = "#35e6ff";
    ctx.shadowBlur = 12;
    ctx.fillText(this.word.da, this.x, this.y);
    ctx.shadowBlur = 0;
  }
}

function spawnExplosion(x, y) {
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 180;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 0.6 + Math.random() * 0.4,
      color: ["#39ff88", "#35e6ff", "#ff3ea5", "#ffd93d"][Math.floor(Math.random() * 4)],
    });
  }
}

function spawnWord() {
  const pool = getPackWords();   // слова з обраного пака
  const w = pool[Math.floor(Math.random() * pool.length)];
  words.push(new FallingWord(w));
}

function updateHUD() {
  document.getElementById("blastScore").textContent = score;
  document.getElementById("blastXP").textContent = gameXP;
  document.getElementById("blastLives").textContent = "❤️".repeat(Math.max(0, lives));
}

function loop(timestamp) {
  if (!running) return;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (timestamp - lastSpawn > spawnInterval) {
    spawnWord();
    lastSpawn = timestamp;
  }

  const W = canvas.clientWidth, H = canvas.clientHeight;
  ctx.clearRect(0, 0, W, H);

  // Рух фонових зірок
  ctx.fillStyle = "rgba(255,255,255,.5)";
  starfield.forEach(s => {
    s.y += s.speed * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    ctx.fillRect(s.x, s.y, s.r, s.r);
  });

  for (let i = words.length - 1; i >= 0; i--) {
    const fw = words[i];
    fw.update(dt);
    fw.draw();
    if (fw.y > H - 10) {
      words.splice(i, 1);
      lives--;
      updateHUD();
      if (lives <= 0) endGame();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 200 * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(loop);
}

input.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !running) return;
  const typed = input.value.trim().toLowerCase();

  for (let i = 0; i < words.length; i++) {
    const fw = words[i];
    const accepted = fw.word.uk.toLowerCase().split("/").map(s => s.trim());
    if (accepted.includes(typed)) {
      words.splice(i, 1);
      spawnExplosion(fw.x, fw.y);
      score++;
      gameXP += CONFIG.XP_PER_CORRECT;
      recordCorrectAnswer(fw.word.id);

      fallSpeed = Math.min(CONFIG.BLAST.FALL_SPEED_MAX, fallSpeed * CONFIG.BLAST.FALL_SPEED_RAMP);
      spawnInterval = Math.max(CONFIG.BLAST.SPAWN_INTERVAL_MIN, spawnInterval * CONFIG.BLAST.SPAWN_RAMP);

      updateHUD();
      input.value = "";
      input.placeholder = t("blast.nice");
      setTimeout(() => input.placeholder = t("blast.input_ph"), 700);
      return;
    }
  }

  input.value = "";
  input.placeholder = t("blast.miss");
  setTimeout(() => input.placeholder = t("blast.input_ph"), 700);
});

function startGame() {
  words = []; particles = [];
  score = 0; gameXP = 0;
  lives = CONFIG.BLAST.START_LIVES;
  fallSpeed = CONFIG.BLAST.FALL_SPEED_START;
  spawnInterval = CONFIG.BLAST.SPAWN_INTERVAL_START;
  lastSpawn = 0; lastTime = performance.now();
  running = true;
  initStars();
  updateHUD();
  document.getElementById("btnStart").style.display = "none";
  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  document.getElementById("finalScore").textContent = score;
  document.getElementById("finalXP").textContent = gameXP;
  document.getElementById("gameOverModal").classList.add("open");
}

document.getElementById("btnStart").addEventListener("click", () => {
  resizeCanvas();
  startGame();
  input.focus();
});

applyI18n();
buildPackSelector("packSelect", () => location.reload());
resizeCanvas();
</script>
</body>
</html>
