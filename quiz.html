<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicBoost — Квіз</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<nav class="nav">
  <span class="nav__brand">⚡ NORDICBOOST</span>
  <div class="nav__links">
    <a href="index.html" data-i18n="nav.home">Головна</a>
    <a href="flashcards.html" data-i18n="nav.cards">Картки</a>
    <a href="quiz.html" class="active" data-i18n="nav.quiz">Квіз</a>
    <a href="blast.html" data-i18n="nav.blast">Word Blast</a>
    <a href="grammar.html" data-i18n="nav.grammar">Граматика</a>
    <button class="btn btn--ghost btn--small" data-lang-toggle onclick="toggleLang()">🇩🇰 DA</button>
  </div>
</nav>

<main class="container">
  <h1 class="page-title">🧠 <span data-i18n="nav.quiz">Квіз</span></h1>
  <p class="page-sub"><span data-i18n="quiz.sub">Обери правильний данський переклад. За кожну правильну відповідь — </span><span style="color:var(--neon-green)">+<span id="xpPreview">10</span> XP</span>!</p>

  <div class="card">
    <h2 id="questionWord" class="question-word">—</h2>
    <p class="muted" data-i18n="quiz.pick">Обери данський переклад:</p>

    <div class="quiz-options" id="options"></div>

    <p class="quiz-feedback" id="feedback"></p>

    <button class="btn mt-2" id="btnNext" style="display:none" data-i18n="quiz.next">Наступне питання →</button>
  </div>

  <div class="stat-grid mt-2">
    <div class="stat"><div class="stat__value" id="quizCorrect">0</div><div class="stat__label" data-i18n="quiz.streak">Правильних підряд</div></div>
    <div class="stat"><div class="stat__value" id="quizXP">0</div><div class="stat__label" data-i18n="quiz.session">XP за сесію</div></div>
  </div>
</main>

<script src="data.js?v=6"></script>
<script src="core.js?v=6"></script>
<script>
let currentWord = null;
let sessionXP = 0;
let streak = 0;

const OPTION_COUNT = 4;    // скільки варіантів відповіді (легко змінити)
const t = key => I18N[getLang()][key];

/* Питання = випадкове слово; правильна відповідь + «приманки» */
function nextQuestion() {
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "quiz-feedback";
  document.getElementById("btnNext").style.display = "none";
  document.getElementById("xpPreview").textContent = CONFIG.XP_PER_CORRECT;

  currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];

  const distractors = [];
  while (distractors.length < OPTION_COUNT - 1) {
    const w = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (w.id !== currentWord.id && !distractors.find(d => d.id === w.id)) distractors.push(w);
  }

  const options = [currentWord, ...distractors];
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  document.getElementById("questionWord").textContent = currentWord.uk;

  const container = document.getElementById("options");
  container.innerHTML = "";
  options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "quiz-option";
    btn.textContent = opt.da;
    btn.setAttribute("data-n", (i + 1));   // номер для стилю з бейджем
    btn.addEventListener("click", e => {
      checkAnswer(btn, opt);
      if (opt.id === currentWord.id) {
        // Літаючий "+10 XP" від місця кліку
        const r = btn.getBoundingClientRect();
        showXPGain(r.left + r.width / 2, r.top, CONFIG.XP_PER_CORRECT);
      }
    });
    container.appendChild(btn);
  });
}

/* Перевірка відповіді + XP + mastery у localStorage */
function checkAnswer(button, opt) {
  document.querySelectorAll(".quiz-option").forEach(b => b.disabled = true);

  const feedback = document.getElementById("feedback");
  const correct = (opt.id === currentWord.id);

  if (correct) {
    button.classList.add("correct");
    feedback.textContent = t("quiz.ok") + CONFIG.XP_PER_CORRECT + " XP";
    feedback.classList.add("ok");

    const newMastery = recordCorrectAnswer(currentWord.id);
    sessionXP += CONFIG.XP_PER_CORRECT;
    streak++;

    if (newMastery === CONFIG.MASTERY_TO_LEARN) {
      feedback.textContent += t("quiz.word_learned");
    }
  } else {
    button.classList.add("wrong");
    document.querySelectorAll(".quiz-option").forEach(b => {
      if (b.textContent === currentWord.da) b.classList.add("correct");
    });
    feedback.textContent = t("quiz.bad") + currentWord.da + "»";
    feedback.classList.add("bad");
    streak = 0;
  }

  document.getElementById("quizCorrect").textContent = streak;
  document.getElementById("quizXP").textContent = sessionXP;
  document.getElementById("btnNext").style.display = "inline-block";
}

document.getElementById("btnNext").addEventListener("click", nextQuestion);

applyI18n();
nextQuestion();
</script>
</body>
</html>
