<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NordicBoost — Квіз</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <span class="nav__brand">⚡ NORDICBOOST</span>
  <div class="nav__links">
    <a href="index.html">Головна</a>
    <a href="flashcards.html">Картки</a>
    <a href="quiz.html" class="active">Квіз</a>
    <a href="blast.html">Word Blast</a>
  </div>
</nav>

<main class="container">
  <h1 class="page-title">🧠 Квіз</h1>
  <p class="page-sub">Обери правильний данський переклад. За кожну правильну відповідь — <span style="color:var(--neon-green)">+10 XP</span>!</p>

  <div class="card">
    <!-- Питання: українське слово -->
    <h2 id="questionWord" style="font-size:1.8rem; color:var(--neon-yellow)">—</h2>
    <p class="muted">Обери данський переклад:</p>

    <div class="quiz-options" id="options"></div>

    <p class="quiz-feedback" id="feedback"></p>

    <button class="btn mt-2" id="btnNext" style="display:none">Наступне питання →</button>
  </div>

  <div class="stat-grid mt-2">
    <div class="stat"><div class="stat__value" id="quizCorrect">0</div><div class="stat__label">Правильних підряд</div></div>
    <div class="stat"><div class="stat__value" id="quizXP">0</div><div class="stat__label">XP за сесію</div></div>
  </div>
</main>

<script src="data.js"></script>
<script src="core.js"></script>
<script>
let currentWord = null;     // поточне слово-питання
let sessionXP = 0;          // XP, зароблені за цю сесію квізу
let streak = 0;            // правильні відповіді підряд

const OPTION_COUNT = 4;    // скільки варіантів відповіді показувати (легко змінити)

/* Питання = випадкове слово; правильна відповідь + 3 випадкові «приманки» */
function nextQuestion() {
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "quiz-feedback";
  document.getElementById("btnNext").style.display = "none";

  currentWord = WORDS[Math.floor(Math.random() * WORDS.length)];

  // Збираємо унікальні неправильні варіанти
  const distractors = [];
  while (distractors.length < OPTION_COUNT - 1) {
    const w = WORDS[Math.floor(Math.random() * WORDS.length)];
    if (w.id !== currentWord.id && !distractors.find(d => d.id === w.id)) distractors.push(w);
  }

  // Перемішуємо варіанти
  const options = [currentWord, ...distractors];
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }

  document.getElementById("questionWord").textContent = currentWord.uk;

  const container = document.getElementById("options");
  container.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "quiz-option";
    btn.textContent = opt.da;
    btn.addEventListener("click", () => checkAnswer(btn, opt));
    container.appendChild(btn);
  });
}

/* Перевіряє відповідь, нараховує XP та оновлює mastery в localStorage */
function checkAnswer(button, opt) {
  // Блокуємо повторні кліки
  document.querySelectorAll(".quiz-option").forEach(b => b.disabled = true);

  const feedback = document.getElementById("feedback");
  const correct = (opt.id === currentWord.id);

  if (correct) {
    button.classList.add("correct");
    feedback.textContent = "✅ Rigtigt! (Правильно!) +" + CONFIG.XP_PER_CORRECT + " XP";
    feedback.classList.add("ok");

    // === ГОЛОВНЕ: фіксуємо прогрес і XP у localStorage ===
    const newMastery = recordCorrectAnswer(currentWord.id);
    sessionXP += CONFIG.XP_PER_CORRECT;
    streak++;

    if (newMastery === CONFIG.MASTERY_TO_LEARN) {
      feedback.textContent += " 🎉 Слово вивчено!";
    }
  } else {
    button.classList.add("wrong");
    // Підсвічуємо правильну відповідь
    document.querySelectorAll(".quiz-option").forEach(b => {
      if (b.textContent === currentWord.da) b.classList.add("correct");
    });
    feedback.textContent = "❌ Neppeki! Правильно: \"" + currentWord.da + "\"";
    feedback.classList.add("bad");
    streak = 0;
  }

  document.getElementById("quizCorrect").textContent = streak;
  document.getElementById("quizXP").textContent = sessionXP;
  document.getElementById("btnNext").style.display = "inline-block";
}

document.getElementById("btnNext").addEventListener("click", nextQuestion);

nextQuestion();
</script>
</body>
</html>
